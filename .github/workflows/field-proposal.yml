name: Standalone field-only model proposal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify rejection cases and byte preservation offline
        run: python3 -B -m unittest discover -s simulator/app -p 'test*.py'
      - name: Run one field-only proposal without simulator or writes
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python3 -B simulator/app/field_proposal.py
